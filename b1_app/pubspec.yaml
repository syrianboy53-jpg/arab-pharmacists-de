name: b1_deutsch
description: "B1 Deutsch - تحضير امتحان الألماني للسوريين"
publish_to: 'none'
version: 2.0.0+65

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.4
  audioplayers: ^6.1.0
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  provider: ^6.1.2
  smooth_page_indicator: ^1.2.0+3
  percent_indicator: ^4.2.3
  confetti: ^0.8.0
  webview_flutter: ^4.13.1
  url_launcher: ^6.3.2
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "../landing/brand/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/audio/
