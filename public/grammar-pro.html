<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar Pro 📚 | B1 Deutsch للسوريين</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
    .german-text { font-family: 'Tajawal', sans-serif; direction: ltr; display: inline-block; }
    [x-cloak] { display: none !important; }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
  </style>
</head>
<body x-data="grammarApp()" x-init="initData()" class="text-slate-800">

  <header class="bg-gradient-to-r from-teal-600 to-emerald-700 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/app/index.html" class="hover:bg-white/20 p-2 rounded-full transition" title="العودة للتطبيق">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <h1 class="text-xl font-bold">قواعد اللغة الألمانية (Grammar Pro) 📚</h1>
      </div>
      <!-- Overall Progress -->
      <div class="text-sm font-bold bg-white/20 px-3 py-1 rounded-full flex items-center gap-2" x-show="lessons.length > 0" x-cloak>
        🏆 إنجازك: <span x-text="completedLessons.length + ' / ' + lessons.length"></span>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <div x-show="isLoading" class="flex flex-col items-center justify-center py-20">
      <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-teal-600 border-solid mb-4"></div>
      <p class="text-gray-500 font-semibold animate-pulse">جاري تحميل القواعد...</p>
    </div>

    <div x-show="!isLoading" x-cloak class="grid grid-cols-1 md:grid-cols-4 gap-6">
      <!-- Sidebar -->
      <aside class="md:col-span-1 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden h-[calc(100vh-140px)] flex flex-col">
        <div class="p-4 border-b border-slate-100 bg-slate-50 font-bold text-slate-700">
          قائمة الدروس
        </div>
        <div class="overflow-y-auto flex-1 p-2 space-y-1">
          <template x-for="(lesson, index) in lessons" :key="lesson.id">
            <button @click="selectLesson(index)" 
                    :class="{'bg-teal-50 border-teal-500 text-teal-700': activeIndex === index, 'border-transparent hover:bg-slate-50 text-slate-600': activeIndex !== index}"
                    class="w-full text-right p-3 rounded-xl border-l-4 transition-all duration-200 flex items-center justify-between gap-1 group">
              <div class="flex flex-col gap-1">
                <span class="text-sm font-bold" x-text="lesson.titleAr"></span>
                <span class="text-xs german-text text-gray-400 group-hover:text-teal-500" x-text="lesson.title"></span>
              </div>
              <div x-show="completedLessons.includes(lesson.id)" class="text-emerald-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              </div>
            </button>
          </template>
        </div>
      </aside>

      <!-- Main Panel -->
      <section class="md:col-span-3 bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden h-[calc(100vh-140px)] flex flex-col relative" x-show="activeLesson">
        
        <div class="p-6 border-b border-slate-100 bg-gradient-to-r from-teal-50 to-emerald-50 relative overflow-hidden">
          <div class="absolute -right-10 -top-10 w-32 h-32 bg-white/40 rounded-full blur-2xl"></div>
          <h2 class="text-2xl font-bold text-teal-800 mb-2 relative z-10" x-text="activeLesson?.titleAr"></h2>
          <p class="text-lg german-text text-teal-600 font-semibold relative z-10" x-text="activeLesson?.title"></p>
        </div>

        <div class="overflow-y-auto flex-1 p-6 space-y-8" id="lesson-scroll-container">
          <!-- Explanation -->
          <div class="bg-blue-50 border border-blue-100 rounded-2xl p-5 shadow-inner">
            <h3 class="flex items-center gap-2 font-bold text-blue-800 mb-4 border-b border-blue-200 pb-2">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              الشرح المختصر
            </h3>
            <p class="text-slate-700 leading-relaxed whitespace-pre-line text-lg" x-text="activeLesson?.explanation"></p>
          </div>

          <!-- Interactive Examples (Flashcards) -->
          <div x-show="activeLesson?.examples && activeLesson.examples.length > 0">
            <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2">
              <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
              أمثلة تفاعلية (اضغط لإظهار الترجمة)
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <template x-for="ex in activeLesson?.examples" :key="ex.de">
                <div x-data="{ show: false }" @click="show = !show" class="cursor-pointer bg-white border-2 border-slate-200 rounded-xl p-4 shadow-sm hover:border-teal-400 hover:shadow-md transition-all duration-300 relative group min-h-[90px] flex flex-col justify-center">
                  <p class="german-text text-lg font-bold text-slate-800 text-center" x-text="ex.de"></p>
                  <div class="absolute inset-0 bg-teal-50 rounded-xl flex items-center justify-center p-4 transition-all duration-300"
                       :class="show ? 'opacity-100 z-10' : 'opacity-0 -z-10'">
                    <p class="text-teal-800 text-center font-bold" x-text="ex.ar"></p>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- Interactive Step-by-Step Quiz -->
          <div x-show="activeLesson?.exercises && activeLesson.exercises.length > 0" class="pt-6 border-t border-slate-100">
            <div class="flex items-center justify-between mb-4">
              <h3 class="font-bold text-slate-800 flex items-center gap-2">
                <svg class="w-5 h-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                تحدي الدرس (اختبر فهمك)
              </h3>
              <span class="text-sm font-bold text-slate-500" x-text="(currentExIndex + 1) + ' / ' + activeLesson.exercises.length"></span>
            </div>

            <!-- Quiz Progress Bar -->
            <div class="w-full bg-slate-100 h-2 rounded-full mb-6 overflow-hidden">
              <div class="bg-gradient-to-r from-teal-400 to-emerald-500 h-2 rounded-full transition-all duration-500"
                   :style="'width: ' + ((currentExIndex / activeLesson.exercises.length) * 100) + '%'"></div>
            </div>
            
            <div class="relative min-h-[250px]">
              <template x-for="(exercise, index) in activeLesson?.exercises" :key="index">
                <div x-show="currentExIndex === index" x-transition.opacity.duration.300ms class="absolute inset-0 bg-slate-50 border-2 rounded-2xl p-6 flex flex-col"
                     :class="{'shake border-red-400': isWrong, 'border-slate-200': !isWrong}">
                  
                  <p class="german-text text-xl font-bold text-slate-800 mb-6 text-center" x-text="exercise.question.replace('___', '______')"></p>
                  
                  <div class="flex flex-wrap justify-center gap-3 mt-auto">
                    <template x-for="(option, optIndex) in exercise.options" :key="optIndex">
                      <button @click="checkAnswer(index, optIndex, exercise.correct)"
                              :class="{
                                'bg-white border-slate-300 hover:border-teal-500 hover:bg-teal-50 hover:shadow-md': answeredIndex !== optIndex,
                                'bg-emerald-500 border-emerald-600 text-white shadow-lg scale-105': answeredIndex === optIndex && isCorrect,
                                'bg-red-500 border-red-600 text-white': answeredIndex === optIndex && !isCorrect
                              }"
                              :disabled="isCorrect"
                              class="px-6 py-3 border-2 rounded-xl german-text font-bold text-lg transition-all duration-200">
                        <span x-text="option"></span>
                      </button>
                    </template>
                  </div>
                </div>
              </template>

              <!-- Completion Screen -->
              <div x-show="currentExIndex === activeLesson?.exercises.length" x-transition.opacity.duration.500ms class="absolute inset-0 bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-6 flex flex-col items-center justify-center text-center">
                <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mb-4">
                  <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h3 class="text-2xl font-bold text-emerald-800 mb-2">ممتاز جداً! 🎉</h3>
                <p class="text-emerald-600 mb-6 font-semibold">لقد أتممت هذا الدرس بنجاح تام.</p>
                <div class="flex gap-4">
                  <button @click="resetLesson()" class="px-6 py-2 bg-white text-emerald-600 border border-emerald-200 font-bold rounded-xl hover:bg-emerald-100 transition">إعادة التدريب</button>
                  <button @click="nextLesson()" class="px-6 py-2 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 transition shadow-md">الدرس التالي ➡️</button>
                </div>
              </div>
            </div>

          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    // Simple Audio Generator to avoid fetching external MP3 files
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      if(type === 'correct') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } else {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      }
    }

    function grammarApp() {
      return {
        isLoading: true,
        lessons: [],
        activeIndex: 0,
        completedLessons: JSON.parse(localStorage.getItem('grammar_completed') || '[]'),
        
        // Quiz State
        currentExIndex: 0,
        answeredIndex: null,
        isCorrect: false,
        isWrong: false,

        get activeLesson() {
          return this.lessons[this.activeIndex] || null;
        },

        async initData() {
          try {
            const res = await fetch('grammarLessons.json');
            if (res.ok) {
              const data = await res.json();
              this.lessons = data;
            }
          } catch (e) {
            console.error("Error fetching grammar:", e);
          } finally {
            this.isLoading = false;
          }
        },

        selectLesson(index) {
          this.activeIndex = index;
          this.resetLesson();
          const panel = document.getElementById('lesson-scroll-container');
          if(panel) panel.scrollTop = 0;
        },

        resetLesson() {
          this.currentExIndex = 0;
          this.answeredIndex = null;
          this.isCorrect = false;
          this.isWrong = false;
        },

        checkAnswer(exerciseIndex, selectedOption, correctOption) {
          if (this.isCorrect) return; // Prevent double click while animating
          this.answeredIndex = selectedOption;
          
          if (selectedOption === correctOption) {
            this.isCorrect = true;
            this.isWrong = false;
            playSound('correct');
            
            setTimeout(() => {
              this.currentExIndex++;
              this.answeredIndex = null;
              this.isCorrect = false;
              
              // Check if finished
              if(this.currentExIndex >= this.activeLesson.exercises.length) {
                this.markLessonCompleted();
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#10b981', '#3b82f6', '#f59e0b'] });
              }
            }, 800);
          } else {
            this.isWrong = true;
            playSound('wrong');
            setTimeout(() => { this.isWrong = false; this.answeredIndex = null; }, 500);
          }
        },

        markLessonCompleted() {
          if(!this.completedLessons.includes(this.activeLesson.id)) {
            this.completedLessons.push(this.activeLesson.id);
            localStorage.setItem('grammar_completed', JSON.stringify(this.completedLessons));
          }
        },

        nextLesson() {
          if (this.activeIndex < this.lessons.length - 1) {
            this.selectLesson(this.activeIndex + 1);
          }
        }
      }
    }
  </script>
</body>
</html>
